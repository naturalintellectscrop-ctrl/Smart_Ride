<style>

<script>
        // Micro-interaction for Star Rating
        const stars = document.querySelectorAll('#star-rating span');
        stars.forEach((star, index) => {
            star.parentElement.addEventListener('click', () => {
                stars.forEach((s, i) => {
                    if (i <= index) {
                        s.classList.add('star-active');
                        s.classList.remove('text-outline');
                    } else {
                        s.classList.remove('star-active');
                        s.classList.add('text-outline');
                    }
                });
            });
        });

        // Small Atmospheric Confetti Effect
        const container = document.getElementById('confetti-container');
        const colors = ['#005f3a', '#6bff8f', '#0e7a4d', '#7cd9a4'];
        
        function createConfetti() {
            for (let i = 0; i < 20; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDuration = (Math.random() * 2 + 1) + 's';
                confetti.style.opacity = Math.random();
                container.appendChild(confetti);
                
                setTimeout(() => confetti.remove(), 3000);
            }
        }
        
        // Trigger on load
        window.onload = () => {
            setTimeout(createConfetti, 500);
        };
    </script>
