<script>
        // Micro-interaction: Active state scaling and ripple-like effect logic
        document.querySelectorAll('button, a').forEach(elem => {
            elem.addEventListener('mousedown', () => {
                elem.classList.add('opacity-80');
            });
            elem.addEventListener('mouseup', () => {
                elem.classList.remove('opacity-80');
            });
            elem.addEventListener('mouseleave', () => {
                elem.classList.remove('opacity-80');
            });
        });

        // Simple scroll observer for header transparency/shadow
        const header = document.querySelector('header');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 20) {
                header.classList.add('shadow-md');
                header.classList.add('bg-opacity-90');
                header.classList.add('backdrop-blur-md');
            } else {
                header.classList.remove('shadow-md');
                header.classList.remove('bg-opacity-90');
                header.classList.remove('backdrop-blur-md');
            }
        });
    </script>
