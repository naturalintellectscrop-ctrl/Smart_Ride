version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: smartride-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartride
      POSTGRES_USER: smartride
      POSTGRES_PASSWORD: smartride_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartride -d smartride"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartride-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://smartride:smartride_dev_password@postgres:5432/smartride?schema=public
      JWT_SECRET: change-me-in-production-use-a-strong-random-string
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:3000/api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
    driver: local
