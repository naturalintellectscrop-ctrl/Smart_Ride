# Smart Ride Realtime Service - Fly.io Configuration
# https://fly.io/docs/reference/configuration/

app = "smartride-realtime"
primary_region = "jnb"  # Johannesburg - closest to Uganda

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  [http_service.concurrency]
    type = "connections"
    hard_limit = 500
    soft_limit = 250

# Internal API port (not exposed publicly - used by Vercel serverless functions)
[[services]]
  internal_port = 3002
  protocol = "tcp"
  # Don't expose this port publicly - only for internal API calls
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[env]
  SOCKET_PORT = "3001"
  API_PORT = "3002"
  NODE_ENV = "production"

# Secrets (set via `fly secrets set`):
# JWT_SECRET=your_jwt_secret_here
# INTERNAL_API_KEY=your_internal_api_key_here
