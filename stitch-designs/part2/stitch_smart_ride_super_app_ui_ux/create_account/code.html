<body class="bg-mesh min-h-screen font-body-md text-on-background selection:bg-secondary-container selection:text-on-secondary-container">
<!-- TopAppBar - Suppressed FAB but kept Header for Contextual Identity -->
<header class="fixed top-0 w-full z-50 bg-surface dark:bg-surface-dim shadow-sm flex items-center justify-between px-container-margin h-14 w-full">
<button class="material-symbols-outlined text-primary hover:bg-surface-container-high transition-colors p-2 rounded-full active:scale-95 transition-transform">arrow_back</button>
<span class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary">Smart Ride</span>
<div class="w-10"></div> <!-- Spacer for symmetry -->
</header>
<main class="pt-14 pb-12 min-h-screen flex flex-col items-center justify-start px-container-margin">
<!-- Hero Section / Brand Context -->
<section class="w-full max-w-md mt-xl mb-xl text-center">
<h1 class="font-display-lg text-display-lg text-primary mb-sm">Join the ride</h1>
<p class="font-body-md text-body-md text-on-surface-variant px-md">Experience the most reliable ride-hailing service in Uganda. Secure, fast, and tech-forward.</p>
</section>
<!-- Form Container - Level 1 Elevation -->
<div class="w-full max-w-md bg-surface p-lg rounded-xl shadow-[0_4px_12px_rgba(0,0,0,0.08)]">
<form class="space-y-lg" id="createAccountForm">
<!-- Full Name Field -->
<div class="space-y-xs">
<label class="font-label-lg text-label-lg text-on-surface px-1" for="fullName">Full Name</label>
<div class="flex items-center bg-surface-container-low rounded-lg p-md input-focus-ring transition-all group border border-transparent focus-within:border-primary">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary transition-colors mr-sm">person</span>
<input class="bg-transparent border-none focus:ring-0 w-full p-0 text-body-md placeholder:text-outline-variant text-on-surface" id="fullName" name="fullName" placeholder="Enter your full name" required="" type="text"/>
</div>
</div>
<!-- Email Address Field -->
<div class="space-y-xs">
<label class="font-label-lg text-label-lg text-on-surface px-1" for="email">Email Address (Optional)</label>
<div class="flex items-center bg-surface-container-low rounded-lg p-md input-focus-ring transition-all group border border-transparent focus-within:border-primary">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary transition-colors mr-sm">mail</span>
<input class="bg-transparent border-none focus:ring-0 w-full p-0 text-body-md placeholder:text-outline-variant text-on-surface" id="email" name="email" placeholder="email@example.com" type="email"/>
</div>
</div>
<!-- Referral Code Field -->
<div class="space-y-xs">
<label class="font-label-lg text-label-lg text-on-surface px-1" for="referral">Referral Code (Optional)</label>
<div class="flex items-center bg-surface-container-low rounded-lg p-md input-focus-ring transition-all group border border-transparent focus-within:border-primary">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary transition-colors mr-sm">redeem</span>
<input class="bg-transparent border-none focus:ring-0 w-full p-0 text-body-md placeholder:text-outline-variant text-on-surface" id="referral" name="referral" placeholder="Enter code" type="text"/>
</div>
</div>
<!-- Terms & Conditions -->
<div class="flex items-start gap-sm px-1 py-sm">
<div class="relative flex items-center">
<input class="w-6 h-6 rounded border-outline text-primary focus:ring-primary focus:ring-offset-0 transition-all cursor-pointer" id="terms" name="terms" required="" type="checkbox"/>
</div>
<label class="font-body-sm text-body-sm text-on-surface-variant leading-relaxed" for="terms">
                        By creating an account, you agree to our <a class="text-primary font-semibold hover:underline" href="#">Terms of Service</a> and <a class="text-primary font-semibold hover:underline" href="#">Privacy Policy</a>.
                    </label>
</div>
<!-- CTA Button -->
<button class="w-full h-14 bg-primary text-on-primary font-label-lg text-label-lg rounded-full shadow-lg hover:bg-primary-container transition-all active:scale-[0.98] flex items-center justify-center gap-sm mt-xl" type="submit">
                    Create Account
                    <span class="material-symbols-outlined">chevron_right</span>
</button>
</form>
</div>
<!-- Decorative Illustration Element -->
<div class="mt-xl w-full max-w-md overflow-hidden rounded-xl h-48 relative group shadow-sm">
<img class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" data-alt="A cinematic, high-angle shot of a vibrant urban street scene in Kampala, Uganda, at dusk. The warm glow of streetlights and golden-hour sunlight illuminates a mix of modern cars and traditional boda bodas navigating a clean, wide road. The overall aesthetic is professional, sleek, and high-tech, using a lush palette of deep greens and soft neutral greys to reflect a modern corporate identity that feels reliable and safe." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDKzLdr_1u-hcdFrNI4ySG17AxDirok-R9pnRTNbLgeK0AFnB6HuW-3pu6Gkm97JmaJVzrlFclq5ck7cRwsjq_bLEDvl2Ya3XglrvvHfBRcye3tRH9xNFtgeJz03ub4NcW3SG33Km33yRDzzuJUvoOumRBq4cK6ns8b9R0C4vSO_03p8Eb6cFOesD5l3cqJhviD515s9-_MWrX9LaK2o7-jxL0gmApmikNtsSfg8qIGVvBGue37fNAjc3VbYiSWFSXtLrVPMBwgRdvA"/>
<div class="absolute inset-0 bg-gradient-to-t from-primary/60 to-transparent flex items-end p-lg">
<span class="text-on-primary font-headline-md text-headline-md">Reliable trips, every time.</span>
</div>
</div>
<!-- Footer Help -->
<p class="mt-xl font-body-sm text-body-sm text-on-surface-variant">
            Already have an account? <a class="text-primary font-semibold hover:underline" href="#">Sign In</a>
</p>
</main>
<script>
        // Micro-interaction for form submission
        document.getElementById('createAccountForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = this.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            
            // Visual feedback
            btn.disabled = true;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> Creating...';
            btn.classList.add('opacity-80');
            
            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Welcome!';
                btn.classList.remove('bg-primary');
                btn.classList.add('bg-secondary');
                
                // Simulate navigation or success splash
                setTimeout(() => {
                   console.log("Account Created Successfully");
                   // reset for demo
                   btn.disabled = false;
                   btn.innerHTML = originalContent;
                   btn.classList.remove('bg-secondary', 'opacity-80');
                   btn.classList.add('bg-primary');
                }, 2000);
            }, 1500);
        });

        // Subtle input interaction effects
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('shadow-md');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('shadow-md');
            });
        });
    </script>
</body></html>
