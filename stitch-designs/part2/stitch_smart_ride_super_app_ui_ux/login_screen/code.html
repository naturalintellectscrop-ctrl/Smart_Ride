<script>
        // Micro-interaction for input formatting
        const phoneInput = document.getElementById('phone-number');
        phoneInput.addEventListener('input', (e) => {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length > 9) value = value.slice(0, 9);
            
            // Basic formatting for Ugandan numbers
            if (value.length > 3 && value.length <= 6) {
                value = value.slice(0, 3) + ' ' + value.slice(3);
            } else if (value.length > 6) {
                value = value.slice(0, 3) + ' ' + value.slice(3, 6) + ' ' + value.slice(6);
            }
            e.target.value = value;
        });

        // Floating label/focus effects
        phoneInput.addEventListener('focus', () => {
            phoneInput.parentElement.classList.add('shadow-md');
        });
        phoneInput.addEventListener('blur', () => {
            phoneInput.parentElement.classList.remove('shadow-md');
        });
    </script>
