<script>
        // Online/Offline Toggle Logic
        let isOnline = true;
        function toggleOnline() {
            const pill = document.getElementById('toggle-pill');
            const container = document.getElementById('status-toggle');
            isOnline = !isOnline;
            
            if (isOnline) {
                pill.style.transform = 'translateX(0)';
                pill.classList.remove('bg-gray-400');
                pill.classList.add('bg-primary');
            } else {
                pill.style.transform = 'translateX(100%)';
                pill.classList.remove('bg-primary');
                pill.classList.add('bg-gray-400');
                // Hide request card when offline
                document.getElementById('incoming-request').style.display = 'none';
            }
        }

        // Timer Logic for Incoming Request
        let timeLeft = 15;
        const totalTime = 15;
        const timerCircle = document.getElementById('timer-circle');
        const countdownEl = document.getElementById('countdown');
        const circumference = 2 * Math.PI * 20;

        const timerInterval = setInterval(() => {
            if (!isOnline) return;
            
            timeLeft -= 0.1;
            const offset = circumference - (timeLeft / totalTime) * circumference;
            if(timerCircle) timerCircle.style.strokeDashoffset = offset;
            if(countdownEl) countdownEl.textContent = Math.ceil(timeLeft);

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                const reqCard = document.getElementById('incoming-request');
                if(reqCard) {
                    reqCard.classList.add('opacity-0', 'translate-y-10');
                    setTimeout(() => {
                        reqCard.style.display = 'none';
                    }, 500);
                }
            }
        }, 100);

        function acceptRide() {
            alert('Ride Accepted! Initializing Navigation and Secure In-app Channel...');
        }
    </script>
