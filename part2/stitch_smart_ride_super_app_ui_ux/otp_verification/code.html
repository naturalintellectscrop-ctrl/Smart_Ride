<span class="material-symbols-outlined text-2xl">backspace</span>

<script>
        // Micro-interaction for OTP Inputs
        const inputs = document.querySelectorAll('.otp-input');
        const keypadButtons = document.querySelectorAll('.keypad-btn');
        let currentIdx = 0;

        keypadButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                const value = btn.textContent.trim().charAt(0);
                const isDelete = btn.querySelector('span')?.textContent === 'backspace';

                if (isDelete) {
                    if (currentIdx > 0) {
                        currentIdx--;
                        inputs[currentIdx].value = '';
                        inputs[currentIdx].classList.remove('border-primary');
                    }
                } else if (!isNaN(value) && value !== "" && currentIdx < 4) {
                    inputs[currentIdx].value = value;
                    inputs[currentIdx].classList.add('border-primary');
                    currentIdx++;
                }
            });
        });

        // Simple Timer Logic
        let timeLeft = 45;
        const timerElement = document.getElementById('timer');
        const countdown = setInterval(() => {
            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerElement.textContent = "Resend now";
                timerElement.classList.add('cursor-pointer', 'underline');
            } else {
                timeLeft--;
                const seconds = timeLeft < 10 ? `0${timeLeft}` : timeLeft;
                timerElement.textContent = `0:${seconds}`;
            }
        }, 1000);
    </script>
