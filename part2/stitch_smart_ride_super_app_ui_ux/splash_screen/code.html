<style>
        @keyframes pulse-soft {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.85; transform: scale(0.98); }
        }
        @keyframes slide-up {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes rotate-loader {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-pulse-soft { animation: pulse-soft 3s ease-in-out infinite; }
        .animate-slide-up { animation: slide-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .loader-ring {
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-top: 2px solid #ffffff;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: rotate-loader 1s linear infinite;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            overscroll-behavior: none;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="bg-primary-container h-screen w-full flex flex-col items-center justify-center overflow-hidden font-body-md text-on-primary">
<div class="flex flex-col items-center justify-between h-full py-xl px-container-margin w-full max-w-md mx-auto">

<!-- Decorative Glow Background -->
<div class="absolute inset-0 bg-secondary-container/10 blur-3xl rounded-full"></div>
<img alt="Smart Ride Logo" class="w-full h-full object-contain relative z-10" src="https://lh3.googleusercontent.com/aida/ADBb0ui-Oj0EF0jJxU4i8FLE7NPfMVNJUwqUtqgTj1-h8J8Ev2F18lcWkg-W2GmuzqpnLAr_r05hI99LdYOrYERTfT3jnhmZ38uz6cMFeBWfMmkiIcYZkly2aNiYm5oqckBK4OsSYh0fGC2g58pm6UcVnRI-l_umTRd2xqD1cu0LEsN-TQ0HlzlYm_OF2qGwXMXzWZMihY-LgNKH1gzpKUuuWx4IWR5bKyFVkGW-5j56Q5aR0k0owl_v1hgbWEIT"/>

<p class="font-label-md text-label-md text-on-primary-container/80 tracking-widest uppercase">Uganda's Premium Choice</p>
</div>
</div>
<!-- Bottom Footer Section -->
<div class="flex flex-col items-center gap-md w-full animate-slide-up" style="animation-delay: 0.5s;">
<!-- Loading Indicator -->
<div class="loader-ring mb-sm"></div>
<!-- Sub-brand Tagline -->
<div class="text-center">
<span class="font-headline-md text-headline-md text-white block">Les Transporteurs</span>
<span class="font-label-md text-label-md text-on-primary-container/60 block mt-xs">Reliable • Smart • Secure</span>
</div>
<!-- Versioning / Small Tag -->
<div class="mt-lg">
<p class="font-label-md text-label-md text-on-primary-container/40">Version 2.4.0</p>
</div>
</div>
</div>
<!-- Background Atmospheric Effect (Subtle Gradient) -->
<div class="fixed inset-0 pointer-events-none z-[-1] opacity-40">
<div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-secondary-container rounded-full blur-[120px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-primary rounded-full blur-[120px]"></div>
</div>
