<script>
        // Countdown Timer Logic
        let timeLeft = 15;
        const totalTime = 15;
        const countdownCircle = document.getElementById('countdown-circle');
        const countdownText = document.getElementById('countdown-text');
        
        const timer = setInterval(() => {
            timeLeft--;
            if (timeLeft <= 0) {
                clearInterval(timer);
                declineRide();
            }
            
            // Update Text
            countdownText.textContent = timeLeft;
            
            // Update Circle Offset (283 is the max dashoffset)
            const offset = 283 - (283 * timeLeft / totalTime);
            countdownCircle.style.strokeDashoffset = offset;
            
            // Visual Warning for Low Time
            if (timeLeft <= 5) {
                countdownText.classList.remove('text-primary');
                countdownText.classList.add('text-error');
                countdownCircle.classList.remove('text-primary');
                countdownCircle.classList.add('text-error');
            }
        }, 1000);

        function acceptRide() {
            clearInterval(timer);
            alert("Ride Accepted! Navigating to Pickup...");
            // Real app would navigate here
        }

        function declineRide() {
            clearInterval(timer);
            const modal = document.querySelector('main > div');
            modal.style.transition = 'all 0.4s ease';
            modal.style.opacity = '0';
            modal.style.transform = 'translateY(100px)';
            setTimeout(() => {
                alert("Request Declined");
            }, 400);
        }
    </script>
